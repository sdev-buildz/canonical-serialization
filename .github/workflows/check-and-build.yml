name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-and-test-publish:
    strategy:
      matrix:
        node: [22, 24, 26]
        serialize-javascript: [6, 7]
    runs-on: ubuntu-latest
    outputs:
      urls: ${{ steps.pkgprnew.outputs.urls }}
    steps:
      # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

        # v2
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          runtime: node@${{ matrix.node }}
          version: 11

      - run: pnpm ci

      - run: pnpm add serialize-javascript@${{ matrix.serialize-javascript }}
      - run: pnpm exec prettier --write ./pnpm-lock.yaml

      # Run checks and builds.
      - run: pnpm run check

      # Publish to pkgprnew to test publishing before actual publish.
      - name: Upload to pkgprnew. To test published package.
        id: pkgprnew
        if: matrix.node == 24 && matrix.serialize-javascript == 7
        run: pnpm dlx pkg-pr-new publish

  # Run tests against published package.
  test-published-package:
    runs-on: ubuntu-latest
    needs: check-and-test-publish
    steps:
      - run: 'echo ${{ needs.check-and-test-publish.outputs.urls }}'

      # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          runtime: node@24
          version: 11

      - run: pnpm install --frozen-lockfile --dev

      - name: Install published package for testing
        run: pnpm add canonical-serialization-published@${{ needs.check-and-test-publish.outputs.urls }}

      - name: Run tests against published package
        run: npm run test
        env:
          TEST_PUBLISHED_PKG: 'true'
