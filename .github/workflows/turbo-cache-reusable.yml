name: Reusable Turborepo Remote Caching with Github Artifacts

on:
  workflow_call:
    inputs:
      node-version:
        default: '24'
        type: number
        description: 'Node.js version for scoping the cache'
      serialize-javascript-version:
        default: '7'
        type: string
        description: 'serialize-javascript version for scoping the cache'
      os:
        default: ubuntu-latest
        type: string
        description: 'Runner OS for scoping the cache'
    secrets:
      TURBO_SIGNATURE_KEY:
        required: true
        description: 'Secret HMAC key used to sign and verify Turborepo artifacts'
    outputs:
      os:
        value: ${{ jobs.build.outputs.os }}
      node:
        value: ${{ jobs.build.outputs.node }}
      serial:e-js:
        value: ${{ jobs.build.outputs.serialize-js }}

permissions:
  actions: write

jobs:
  build:
    runs-on: ${{ inputs.os }}
    outputs:
      os: ${{ inputs.os }}
      node: '${{ inputs.node-version }}'
      serialize-js: ${{ inputs.serialize-javascript-version }}
    steps:
      - name: Turborepo Local Cache Setup
        # v2.5.1
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7
        with:
          # Scopes the local cache server key uniquely across OS, Node versions and other matrix inputs.
          cache-prefix: 'turbo-${{ inputs.os }}-node-${{ inputs.node-version }}-serialize-js-${{inputs.serialize-javascript-version}}'
