name: CodeQL Analysis

on:
  pull_request:
    branches: [main]

jobs:
  analyze:
    permissions:
      actions: read # Required for CodeQL to fetch telemetry/workflow run info
      contents: read # Required to checkout the code
      security-events: write # Required to upload CodeQL SARIF results to security tab
    name: CodeQL Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Initialize
        uses: github/codeql-action/init@v4
        with:
          queries: security-and-quality
      - name: Perform analysis
        uses: github/codeql-action/analyze@v4
