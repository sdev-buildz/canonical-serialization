name: Publish to npm

on:
  push:
    branches: [main]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      repository-projects: write
      deployments: write
      packages: write
    steps:
      # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

        # v2
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          runtime: node@24
          version: 11

      - run: pnpm ci

      - name: Turborepo Remote Cache using Github Artifacts
        # v2.5.1
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7
        with:
          # Scopes the local cache server key uniquely across OS, Node versions and other matrix inputs.
          cache-prefix: 'turbo-ubuntu-latest-node-24-serialize-js-7'
          signature-key: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

      - name: Create PR or Publish release
        id: changesets
        # v1
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d
        with:
          commit: 'chore: update versions'
          title: 'chore: update versions'
          publish: pnpm run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
